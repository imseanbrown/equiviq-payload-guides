name: Release Payload package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node -e "if (require('./package.json').version !== process.argv[1]) process.exit(1)" "$version"
          npm pack --pack-destination .
          test -f "equiviq-payload-guides-${version}.tgz"
      - name: Publish package archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "equiviq-payload-guides-${version}.tgz" --verify-tag --generate-notes --latest
